<!-- Auth routes render full-screen -->
<ng-container *ngIf="isAuthPage; else shell">
  <router-outlet></router-outlet>
</ng-container>

<ng-template #shell>
  <div class="main">
    <div class="side-navbar" [class.active]="sidebarActive">
      <div class="sidebar-brand">
        <span class="icon brand-icon">
          <img src="assets/images/logo_transparent.ico" alt="Cafeteria logo" />
        </span>
        <span class="text brand-text">Cafeteria</span>
      </div>
      <ul>

        <li data-label="Home">
          <a (click)="navigateHome()" [class.active]="isHomeActive()">
            <span class="icon"><i class='bx bxs-home-circle'></i></span>
            <span class="text">Home</span>
          </a>
        </li>

        <li *ngFor="let rte of routes" [attr.data-label]="rte.menuName">
          <a (click)="navigateurl(rte)" [class.active]="isRouteActive(rte)">
            <span class="icon"><i class='bx' [ngClass]="getBoxIcon(rte)"></i></span>
            <span class="text">{{ rte.menuName }}</span>
          </a>
        </li>

        <li class="logout" data-label="Logout">
          <a (click)="onLogout()">
            <span class="icon"><i class='bx bxs-log-out'></i></span>
            <span class="text">Logout</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="footer-line single">
          <i class="bx bx-copyright"></i>
          <span class="footer-text">2025 Evercare • v{{ appVersion }}</span>
        </div>
      </div>
    </div>

    <div class="content" [class.active]="sidebarActive">
      <div class="top-navbar">
        <div class="nav-left">
          <div class='bx bx-menu' id="menu-icon" (click)="toggleSidebarState()"></div>
          <div class="mobile-brand" *ngIf="!sidebarActive">
            <img src="assets/images/logo_transparent.ico" alt="Cafeteria logo" />
          </div>
        </div>
        <div class="top-actions">
          <div class="badge-wrap" (click)="toggleNotifications()" tabindex="0">
            <i class='bx bx-bell'></i>
            <span class="badge" *ngIf="notifications.length">{{ notifications.length }}</span>
            <div class="dropdown" *ngIf="showNotifications">
              <div class="dropdown-item" *ngFor="let note of notifications | slice:0:5">
                {{ note }}
              </div>
              <button mat-button class="dropdown-btn">View all</button>
            </div>
          </div>
          <div class="badge-wrap" (click)="toggleCart()" tabindex="0">
            <i class='bx bx-cart'></i>
            <span class="badge" *ngIf="cartItems.length">{{ cartItems.length }}</span>
            <div class="dropdown" *ngIf="showCart">
              <div class="dropdown-item" *ngFor="let item of cartItems | slice:0:5">
                {{ item.name || item }}
              </div>
              <button mat-button class="dropdown-btn">View all</button>
            </div>
          </div>
          <div class="avatar dropdown-trigger" (click)="toggleProfile()" tabindex="0">
            {{ getInitials(registration) }}
            <div class="dropdown" *ngIf="showProfile">
              <ul class="dropdown-list">
                <li><button mat-button (click)="navigateProfile()"><i class='bx bxs-user'></i> Profile</button></li>
                <li><button mat-button (click)="navigateSettings()"><i class='bx bxs-cog'></i> Settings</button></li>
                <li><button mat-button (click)="onLogout()"><i class='bx bxs-log-out'></i> Logout</button></li>
              </ul>
            </div>
          </div>
        </div>
      </div>

      <div class="content-area">
        <app-loader></app-loader>
        <div *ngIf="isLoading$ | async">
          <mat-progress-spinner
            class="spinner"
            mode="indeterminate"
            diameter="50"
            color="primary"
          ></mat-progress-spinner>
        </div>
        <div class="content-inner" [class.hide]="isLoading$ | async">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </div>
</ng-template>

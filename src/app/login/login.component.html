<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Redesign</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        .logo-image {
            max-width: 200px;
            height: auto;
        }
        
        .password-input-container {
            position: relative;
        }
        
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7280;
            padding: 4px;
        }
        
        .password-toggle:hover {
            color: #374151;
        }
        
        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
        
        .login-message {
            background-color: #fee2e2;
            color: #dc2626;
            padding: 0.75rem;
            border-radius: 0.375rem;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="w-full min-h-screen bg-gray-50 flex flex-col sm:justify-center items-center pt-6 sm:pt-0">
        <div class="w-full sm:max-w-md p-5 mx-auto">
            <!-- Logo -->
            <div class="text-center mb-8">
                <img src="assets/images/logo.png" alt="Logo" class="logo-image mx-auto" />
            </div>
            
            <!-- Welcome Text -->
            <h2 class="mb-12 text-center text-5xl font-extrabold">Welcome.</h2>
            
            <!-- Login Form -->
            <form [formGroup]="form" (ngSubmit)="onSubmit()">
                <p class="text-center text-gray-600 mb-6">Please login to continue</p>
                
                <!-- Username/Email Field -->
                <div class="mb-4">
                    <label class="block mb-1 text-sm font-medium text-gray-700" for="userName">
                        User/Email
                    </label>
                    <input 
                        id="userName" 
                        type="text" 
                        name="userName" 
                        formControlName="userName"
                        (input)="form.controls.userName.setValue(form.controls.userName.value.toLowerCase())"
                        required
                        class="py-2 px-3 border border-gray-300 focus:border-blue-500 focus:outline-none focus:ring focus:ring-blue-200 focus:ring-opacity-50 rounded-md shadow-sm disabled:bg-gray-100 mt-1 block w-full" 
                        placeholder="Enter your email or username"
                    />
                    <div class="error-message" *ngIf="isFieldInvalid('userName')">
                        Please enter your user name/Email
                    </div>
                </div>
                
                <!-- Password Field -->
                <div class="mb-4">
                    <label class="block mb-1 text-sm font-medium text-gray-700" for="password">
                        Password
                    </label>
                    <div class="password-input-container">
                        <input 
                            id="password" 
                            [type]="hide ? 'password' : 'text'" 
                            name="password" 
                            formControlName="password"
                            required
                            class="py-2 px-3 pr-10 border border-gray-300 focus:border-blue-500 focus:outline-none focus:ring focus:ring-blue-200 focus:ring-opacity-50 rounded-md shadow-sm disabled:bg-gray-100 mt-1 block w-full" 
                            placeholder="Enter your password"
                        />
                        <button 
                            type="button"
                            class="password-toggle"
                            (click)="hide = !hide" 
                            [attr.aria-label]="'Hide password'" 
                            [attr.aria-pressed]="hide"
                        >
                            <span class="material-icons">
                                {{hide ? 'visibility_off' : 'visibility'}}
                            </span>
                        </button>
                    </div>
                    <div class="error-message" *ngIf="isFieldInvalid('password')">
                        Please enter your password
                    </div>
                </div>
                
                <!-- Remember Me and Forgot Password -->
                <div class="mt-6 flex items-center justify-between">
                    <div class="flex items-center">
                        <input 
                            id="remember_me" 
                            type="checkbox" 
                            class="border border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50 rounded" 
                        />
                        <label for="remember_me" class="ml-2 block text-sm leading-5 text-gray-900">
                            Remember me
                        </label>
                    </div>
                    <a 
                        routerLink="../forgot-password" 
                        class="text-sm text-blue-600 hover:text-blue-800 hover:underline"
                    >
                        Forgot your password?
                    </a>
                </div>
                
                <!-- Login Button -->
                <div class="mt-6">
                    <button 
                        type="submit"
                        class="w-full inline-flex items-center justify-center px-4 py-2 bg-blue-600 border border-transparent rounded-md font-semibold capitalize text-white hover:bg-blue-700 active:bg-blue-700 focus:outline-none focus:border-blue-700 focus:ring focus:ring-blue-200 disabled:opacity-25 transition duration-200"
                    >
                        Login
                    </button>
                </div>
            </form>
            
            <!-- Login Message (Error/Success) -->
            <div class="login-message" *ngIf="loginMessage">
                {{loginMessage}}
            </div>
        </div>
    </div>

    <script>
        // Demo functionality for password visibility toggle
        let hide = true;
        
        document.addEventListener('DOMContentLoaded', function() {
            const toggleButton = document.querySelector('.password-toggle');
            const passwordInput = document.getElementById('password');
            
            if (toggleButton && passwordInput) {
                toggleButton.addEventListener('click', function() {
                    hide = !hide;
                    passwordInput.type = hide ? 'password' : 'text';
                    const icon = toggleButton.querySelector('.material-icons');
                    icon.textContent = hide ? 'visibility_off' : 'visibility';
                });
            }
        });
    </script>
</body>
</html>

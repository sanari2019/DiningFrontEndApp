<div class="login-container">
  <div class="background-pattern"></div>
  <div class="gradient-overlay"></div>

  <div class="login-card-wrapper">
    <div class="login-card">
      <div class="logo-container">
        <img src="assets/images/evercare-logo.png" alt="Evercare Hospital Lekki" class="logo-image" />
      </div>

      <div class="header-section">
        <h1 class="title">Welcome Back</h1>
        <p class="subtitle">Access your cafeteria portal</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-field">
          <label for="userName" class="field-label">Email Address</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">mail</span>
            <input
              id="userName"
              type="email"
              formControlName="userName"
              (input)="form.controls.userName.setValue(form.controls.userName.value.toLowerCase())"
              class="form-input"
              [class.input-error]="isFieldInvalid('userName')"
              placeholder="your.email@example.com"
              required
            />
          </div>
          <div class="error-message" *ngIf="isFieldInvalid('userName')">
            Please enter your email address
          </div>
        </div>

        <div class="form-field">
          <label for="password" class="field-label">Password</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">lock</span>
            <input
              id="password"
              [type]="hide ? 'password' : 'text'"
              formControlName="password"
              class="form-input password-input"
              [class.input-error]="isFieldInvalid('password')"
              placeholder="Enter your password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              (click)="hide = !hide"
              [attr.aria-label]="hide ? 'Show password' : 'Hide password'"
            >
              <span class="material-icons">
                {{ hide ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
          <div class="error-message" *ngIf="isFieldInvalid('password')">
            Please enter your password
          </div>
        </div>

        <div class="form-field remember-row">
          <label class="checkbox-container">
            <input type="checkbox" formControlName="rememberMe" />
            <span>Remember me</span>
          </label>
          <button type="button" class="text-link inline-link light" routerLink="/forgot-password">Forgot Password?</button>
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <mat-progress-spinner *ngIf="isLoading" mode="indeterminate" diameter="20"></mat-progress-spinner>
        </button>

        <p class="small-note">
          Need an account?
          <button type="button" class="contact-link" (click)="openDialog()">Contact Administrator</button>
        </p>

        <div class="login-message" *ngIf="loginMessage">
          {{ loginMessage }}
        </div>
      </form>

      <div class="divider"></div>

      <div class="security-note">
        <span class="material-icons">lock</span>
        <p>Secured with 256-bit SSL encryption</p>
      </div>
    </div>
  </div>

  <div class="page-footer">
    <p class="copyright-text">© {{ currentYear }} Evercare Hospital Lekki. All rights reserved.</p>
    <p class="version">v{{ appVersion }}</p>
  </div>
</div>
